name: GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'  # runs daily at midnight
  workflow_dispatch:      # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: joelday/github-contribution-grid-snake@v2
        with:
          username: ${{ github.actor }}  # or your GitHub username
          output: public/github-contribution-grid-snake.svg

      - name: Commit & Push SVG
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add public/github-contribution-grid-snake.svg
          git commit -m "Update contribution snake" || echo "No changes to commit"
          git push
